[package]
name = "nearby-backend"
version = "0.1.0"
edition = "2021"

# This is the src-tauri crate — pair it with the frontend project from
# earlier in the conversation. Versions below are illustrative; run
# `cargo update` and check crates.io for current majors before building.
#
# tauri-plugin-dialog / tauri-plugin-fs: the frontend's SendFilesView and
# SettingsView use these (native file/folder picker, file size lookup) —
# both need to be registered in main.rs via .plugin(...) as well as
# listed here, or invoke() calls to them fail at runtime.

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "oneforall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
mdns-sd = "0.11"
serde = { version = "1", features = ["derive"] }
bincode = "1"
uuid = { version = "1", features = ["v4", "serde"] }
gethostname = "0.4"
futures = "0.3"
dirs = "5"
# "bundled" compiles SQLite in — no system libsqlite3 dependency to
# install separately. Write volume here is low (settings changes,
# transfer start/finish — never per-progress-tick), so the plain
# synchronous rusqlite API is used directly rather than reaching for an
# async driver; see db.rs for the one caveat that comes with that choice.
rusqlite = { version = "0.31", features = ["bundled"] }
printers = "2.3.0"
printpdf = { version = "0.8.2", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
